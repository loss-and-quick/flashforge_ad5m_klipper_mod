[include KAMP/KAMP_Settings.cfg]

# define overrides for Mainsail/Fluidd predefined macros - see web/client.cfg
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 105.0  ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 105.0  ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 10.0    ; custom dz value; the value in mm to lift the nozzle when move to park position
variable_speed_hop        : 25.0    ; z move speed in mm/s
variable_speed_move       : 300.0   ; move speed in mm/s
variable_user_cancel_macro: "_CANCEL_PRINT_WITH_AUDIO_WARNING"
variable_park_at_cancel   : True    ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : 105     ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : 105     ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_runout_sensor    : "filament_switch_sensor runout_sensor"
gcode:

[gcode_macro _PRE_CLEAR_NOZZLE]
description: Prepare for nozzle cleaning - calculate cleaning area and probe
gcode:
    SAVE_GCODE_STATE NAME=PRE_CLEAR_STATE

    # Get bed mesh bounds
    {% set mesh = printer.configfile.settings.bed_mesh %}
    {% set min_x = mesh.mesh_min[0] | float %}
    {% set max_x = mesh.mesh_max[0] | float %}
    {% set min_y = mesh.mesh_min[1] | float %}
    {% set max_y = mesh.mesh_max[1] | float %}
    {% set center_x = (min_x + max_x) / 2 %}

    {% set passes   = params.PASSES   | default(3)   | int %}
    {% set step_y   = params.STEP_Y   | default(1)   | float %}
    {% set span     = params.SPAN     | default(40)  | float %}
    {% set z_high_d = params.Z_START  | default(0.15)| float %}
    {% set z_low_d  = params.Z_END    | default(0.05)| float %}

    # Calculate X bounds from span
    {% set half = span / 2.0 %}
    {% set clean_start_x = [center_x - half, min_x] | max %}
    {% set clean_end_x   = [center_x + half, max_x] | min %}

    # Initial Y (top of bed)
    {% set clean_y = max_y %}
    {% set max_y_offset = (passes - 1) * step_y %}

    # Clamp Y within bed limits
    {% if clean_y - max_y_offset < min_y %}
        {% set clean_y = min_y + max_y_offset %}
        RESPOND PREFIX="warning" MSG="Adjusted clean_y to stay within bounds"
    {% endif %}

    {% if clean_y + max_y_offset > max_y %}
        {% set clean_y = max_y - max_y_offset %}
        RESPOND PREFIX="warning" MSG="Adjusted clean_y to stay within bounds"
    {% endif %}

    RESPOND PREFIX="info" MSG="Pre-cleaning: moving to X{center_x} Y{clean_y} for probing"

    G90
    G1 X{center_x} Y{clean_y} Z15 F3000

    PROBE

    # Save all parameters into _CLEAR_NOZZLE
    SET_GCODE_VARIABLE MACRO=_CLEAR_NOZZLE VARIABLE=passes VALUE={passes}
    SET_GCODE_VARIABLE MACRO=_CLEAR_NOZZLE VARIABLE=step_y VALUE={step_y}
    SET_GCODE_VARIABLE MACRO=_CLEAR_NOZZLE VARIABLE=z_high_d VALUE={z_high_d}
    SET_GCODE_VARIABLE MACRO=_CLEAR_NOZZLE VARIABLE=z_low_d VALUE={z_low_d}
    SET_GCODE_VARIABLE MACRO=_CLEAR_NOZZLE VARIABLE=clean_start_x VALUE={clean_start_x}
    SET_GCODE_VARIABLE MACRO=_CLEAR_NOZZLE VARIABLE=clean_end_x VALUE={clean_end_x}
    SET_GCODE_VARIABLE MACRO=_CLEAR_NOZZLE VARIABLE=clean_y VALUE={clean_y}
    SET_GCODE_VARIABLE MACRO=_CLEAR_NOZZLE VARIABLE=prepared VALUE=True

    RESTORE_GCODE_STATE NAME=PRE_CLEAR_STATE

[gcode_macro _CLEAR_NOZZLE]
description: Nozzle cleaning with smooth Z descent (requires _PRE_CLEAR_NOZZLE)
variable_passes: 3
variable_step_y: 1.0
variable_z_high_d: 0.15
variable_z_low_d: 0.05
variable_clean_start_x: 10.0
variable_clean_end_x: 50.0
variable_clean_y: 100.0
variable_prepared: False
gcode:
    SAVE_GCODE_STATE NAME=CLEAR_NOZZLE_STATE

    {% if not printer["gcode_macro _CLEAR_NOZZLE"].prepared %}
        {action_raise_error("Cleaning not prepared! Run _PRE_CLEAR_NOZZLE first.")}
    {% endif %}

    {% set passes        = printer["gcode_macro _CLEAR_NOZZLE"].passes %}
    {% set step_y        = printer["gcode_macro _CLEAR_NOZZLE"].step_y %}
    {% set z_high_d      = printer["gcode_macro _CLEAR_NOZZLE"].z_high_d %}
    {% set z_low_d       = printer["gcode_macro _CLEAR_NOZZLE"].z_low_d %}
    {% set clean_start_x = printer["gcode_macro _CLEAR_NOZZLE"].clean_start_x %}
    {% set clean_end_x   = printer["gcode_macro _CLEAR_NOZZLE"].clean_end_x %}
    {% set clean_y       = printer["gcode_macro _CLEAR_NOZZLE"].clean_y %}
    {% set zprobe = printer.probe.last_z_result %}

    {% if z_low_d < 0.02 %}
        {action_raise_error("Z_END too low, must be >=0.02mm")}
    {% endif %}

    {% set z_start = zprobe + z_high_d %}
    {% set z_end   = zprobe + z_low_d %}
    {% set z_step  = (z_end - z_start) / (passes - 1) if passes > 1 else 0.0 %}

    RESPOND PREFIX="info" MSG="Cleaning: probe={zprobe} Z:{z_start}->{z_end} passes={passes}"

    G90
    M106 P0 S255
    G92 E0

    FLASHFORGE_LOAD_CELL_SET_MAX_FORCE FORCE=350 ACTION="shutdown"

    G1 X{clean_start_x} Y{clean_y} Z{z_start} F3000

    # Main cleaning loop with gradual Z descent
    {% for i in range(passes) %}
        {% set y_offset = i * step_y %}    # Offset current Y based on pass number
        {% set cur_y = clean_y - y_offset if i % 2 == 0 else clean_y + y_offset %}
        {% set cur_z = z_start + i * z_step %}  # Calculate Z for this pass
        {% if i % 2 == 0 %}
            G1 X{clean_end_x}   Y{cur_y} Z{cur_z} F1200   ; Even — move to end X
        {% else %}
            G1 X{clean_start_x} Y{cur_y} Z{cur_z} F1200   ; Odd  — return to start X
        {% endif %}
    {% endfor %}

    FLASHFORGE_LOAD_CELL_SET_MAX_FORCE RESET=1
    
    M104 S120 T0            ; reduce to 120°C
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={118} MAXIMUM={123}
    M106 P0 S0

    RESPOND PREFIX="info" MSG="Cleaning completed at Z={z_end}"

    G1 Z3.5 F3000           ; raise bed slightly

    SET_GCODE_VARIABLE MACRO=_CLEAR_NOZZLE VARIABLE=prepared VALUE=False

    RESTORE_GCODE_STATE NAME=CLEAR_NOZZLE_STATE

[gcode_macro CLEAN_NOZZLE]
description: Manual nozzle cleaning with heating and method selection
gcode:
    SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE
    
    {% set extruder_temp = params.EXTRUDER_TEMP|default(230)|float %}
    {% set bed_temp = params.BED_TEMP|default(80)|float %}

    RESPOND PREFIX="info" MSG="Running manual nozzle cleaning {extruder_temp}/{bed_temp}"

    {% if not "xyz" in printer.toolhead.homed_axes %}
        G28                  ; home all axes
    {% endif %}

    G90                      ; absolute coordinates
    M82                      ; absolute extruder coordinates
    G1 Z15 F1500             ; raise bed
    M400

    # Heat up
    M140 S{bed_temp}         ; start bed heating
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp-3} MAXIMUM={bed_temp+4}
    M104 S{extruder_temp} T0 ; start extruder heating
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp-2} MAXIMUM={extruder_temp+4}

    LOAD_CELL_TARE          ; reset load cells

    _PRE_CLEAR_NOZZLE
    
    _CLEAR_NOZZLE
    
    RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE

[gcode_macro START_PRINT]
gcode:
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(200)|float %}
    {% set disable_priming = params.DISABLE_PRIMING|default(0)|int == 1 %}
    {% set disable_skew = params.DISABLE_SKEW_CORRECT|default(1)|int == 1 %}
    {% set enable_cleaning = params.ENABLE_CLEANING|default(1)|int == 1 %}
    {% set use_kamp = params.USE_KAMP|default(1)|int == 1 %}
    {% set force_leveling = True if use_kamp else params.FORCE_LEVELING|default(0)|int == 1 %}
    {% set zoffset = params.ZOFFSET|default(0)|float %}

    # Initial setup
    M140 S{bed_temp}        ; start bed heating
    SET_SKEW CLEAR=1        ; reset skew profile if loaded
    SET_GCODE_OFFSET Z={zoffset} ; set the G-Code Z offset
    
    {% if not "xyz" in printer.toolhead.homed_axes %}
        G28                 ; home the printer
    {% endif %}
    
    G1 Z15 F1500           ; raise bed

    {% if enable_cleaning %}
        RESPOND PREFIX="info" MSG="Heating for nozzle cleaning"

        M109 S{extruder_temp - 15} T0  ; heat extruder
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp-5}  ; wait for bed

        LOAD_CELL_TARE          ; reset load cells

        _PRE_CLEAR_NOZZLE
        
        RESPOND PREFIX="info" MSG="Starting nozzle cleaning"

        _CLEAR_NOZZLE
    {% endif %}

    # Adaptive or traditional bed leveling
    {% if (not printer['bed_mesh'].profile_name) or force_leveling %}
            AUTO_BED_LEVEL BED_TEMP={bed_temp} EXTRUDER_TEMP=150 USE_KAMP={use_kamp|int}
    {% endif %}

    SMART_PARK
    
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp}  ; wait for bed
    M109 S{extruder_temp}   ; set and wait for nozzle temperature

    {% if not disable_priming %}
        LINE_PURGE
    {% endif %}

    {% if not disable_skew %}
        SKEW_PROFILE LOAD=skew_profile
    {% endif %}

[gcode_macro _CANCEL_PRINT_WITH_AUDIO_WARNING]
gcode:
    _COMMON_END_PRINT
    M300 S116 P350
    M300 S61 P1000

[gcode_macro END_PRINT]
gcode:
    G91                     ; relative positioning
    G1 X-2 Y-2 E-5 F2000    ; move away while retracting filament
    _COMMON_END_PRINT
    PLAY_MIDI FILE="getitem.mid" C=0

[gcode_macro _COMMON_END_PRINT]
# _COMMON_END_PRINT is used by END_PRINT and CANCEL_PRINT
gcode:
    SET_SKEW CLEAR=1
    M104 S0                 ; turn off extruder temperature
    M140 S0                 ; turn off bed temperature
    M107                    ; turn off part cooling fan
    G90                     ; absolute positioning
    G1 X105 Y105 Z220 F1500 ; move near end stop position
    M84                     ; disable motors

# Use Pause/Resume for M24/M25
[gcode_macro M24]
rename_existing: M24.1
gcode:
    {% if printer.pause_resume.is_paused %}
    RESUME
    {% else %}
        M24.1
    {% endif %}

[gcode_macro M25]
rename_existing: M25.1
gcode:
    PAUSE

[gcode_macro AUTO_BED_LEVEL]
gcode:
    SAVE_GCODE_STATE NAME=AUTO_BED_LEVEL_STATE

    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(150)|float %}
    {% set profile = params.PROFILE|default("auto") %}
    {% set use_kamp = params.USE_KAMP|default(0)|int == 1 %}

    # clear old mesh and home if necessary
    BED_MESH_CLEAR
    {% if not "xyz" in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # bed heating
    G90                     ; absolute coordinates
    G1 Z10 F1800            ; raise bed
    M140 S{bed_temp}        ; set bed temp
    
    {% if printer.heater_bed.temperature < bed_temp - 3 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp-2}
    {% elif printer.heater_bed.temperature > bed_temp + 3 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={bed_temp+2}
    {% endif %}

    # nozzle heating
    M104 S{extruder_temp}   ; set nozzle temperature
    
    {% if printer.extruder.temperature < extruder_temp - 5 %}
        M106 S0             ; stop cooling
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp-2}
    {% elif printer.extruder.temperature > extruder_temp + 5 %}
        M106 S255           ; additional cooling
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={extruder_temp+2}
    {% endif %}

    M106 S125               ; 50% cooling
    G1 Z2 F1800             ; move nozzle near bed
    LOAD_CELL_TARE          ; reset tare before leveling

    {% if not use_kamp %}
        BED_MESH_CALIBRATE PROFILE="{profile}"
    {% else %}
        ADAPTIVE_BED_MESH_CALIBRATE
    {% endif %}

    RESTORE_GCODE_STATE NAME=AUTO_BED_LEVEL_STATE

[gcode_macro LOAD_CELL_TARE]
gcode:
    FLASHFORGE_LOAD_CELL_TARE

[gcode_macro Z_OFFSET_APPLY_ENDSTOP]
# This macro is replaced because saving the z-offset to the endstop would not have the expected outcome
# on this printer. The endstop is separate from the probe. After bed leveling before print, the offset
# would be ineffective.
rename_existing: _Z_OFFSET_APPLY_ENDSTOP
gcode:
    RESPOND MSG="Notice: z-offset should not be saved to endstop on this printer. This command runs Z_OFFSET_APPLY_PROBE instead."
    Z_OFFSET_APPLY_PROBE

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_ORIG
gcode:
    {% if printer.flashforge_loadcell.force_g|abs > 100  %}
        RESPOND MSG="Warning: loadcells are not tared. This can lead to damage to your print plate"
    {% endif %}

    BED_MESH_CALIBRATE_ORIG {rawparams}

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: SCREWS_TILT_CALCULATE_ORIG
gcode:
    {% if printer.flashforge_loadcell.force_g|abs > 100  %}
        RESPOND MSG="Warning: loadcells are not tared. This can lead to damage to your print plate"
    {% endif %}

    SCREWS_TILT_CALCULATE_ORIG {rawparams}

[gcode_macro LOAD_FILAMENT]
variable_load_distance:  125
gcode:
    {% set speed = params.SPEED|default(450) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{speed} ; extrude with 7.5mm/s
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  75
gcode:
    {% set speed = params.SPEED|default(450) %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E-{unload_distance} F{speed} ; unload
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro PURGE_FILAMENT]
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(450) %}
    SAVE_GCODE_STATE NAME=purge_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed}   ; purge
    RESTORE_GCODE_STATE NAME=purge_state

[gcode_macro LOAD_MATERIAL]
description: Manual filament loading / change
variable_initial_target_temp: 0
gcode:
    # save gcode state
    SAVE_GCODE_STATE NAME=load_material_state
    # save heating state
    SET_GCODE_VARIABLE MACRO=LOAD_MATERIAL VARIABLE=initial_target_temp VALUE={printer["extruder"].target}

    _LOAD_MATERIAL_SELECT

[gcode_macro _LOAD_MATERIAL_SELECT]
gcode:
    {% if not printer["extruder"].target >= printer.configfile.settings['extruder'].min_extrude_temp %}
        # material selection
        RESPOND TYPE=command MSG="action:prompt_begin Material Selection"
        RESPOND TYPE=command MSG="action:prompt_text Select the material type to heat the nozzle."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button PLA|_LOAD_MATERIAL_HEATUP TEMP=200|primary"
        RESPOND TYPE=command MSG="action:prompt_button PETG|_LOAD_MATERIAL_HEATUP TEMP=230|primary"
        RESPOND TYPE=command MSG="action:prompt_button ABS|_LOAD_MATERIAL_HEATUP TEMP=250|primary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_footer_button Abort|_LOAD_MATERIAL_END"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        # skip preheating dialog, but wait for target temp
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={printer["extruder"].target}
        _LOAD_MATERIAL_ACTION
    {% endif %}

[gcode_macro _LOAD_MATERIAL_HEATUP]
gcode:
    {% set extruder_temp = params.TEMP|default(200)|float %}
    M104 S{extruder_temp}
    RESPOND TYPE=command MSG=action:prompt_end
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp}
    _LOAD_MATERIAL_ACTION

[gcode_macro _LOAD_MATERIAL_ACTION]
gcode:
    # loading / unloading
    RESPOND TYPE=command MSG="action:prompt_begin Filament Loading"
    RESPOND TYPE=command MSG="action:prompt_text Select filament loading action."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button Unload|UNLOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button Purge|PURGE_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Done|_LOAD_MATERIAL_END"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_MATERIAL_END]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    # restore old temp
    M104 S{printer["gcode_macro LOAD_MATERIAL"].initial_target_temp}
    # restore gcode state
    RESTORE_GCODE_STATE NAME=load_material_state

[gcode_macro _FILAMENT_RUNOUT_EVENT]
gcode:
    PAUSE
    M400
    RESPOND TYPE=command MSG="action:prompt_begin Filament runout detected"
    RESPOND TYPE=command MSG="action:prompt_text The filament sensor has detected filament runout. Please load filament and press resume."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button Unload|UNLOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button Purge|PURGE_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Resume|_INTERACTIVE_LOAD_END"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro M600]
gcode:
    {% set X = params.X|default(printer['gcode_macro _CLIENT_VARIABLE'].custom_park_x)|float %}
    {% set Y = params.Y|default(printer['gcode_macro _CLIENT_VARIABLE'].custom_park_y)|float %}
    {% set Z = params.Z|default(printer['gcode_macro _CLIENT_VARIABLE'].custom_park_dz)|float %}
    PAUSE X={X} Y={Y} Z_MIN={Z}
    M400
    RESPOND TYPE=command MSG="action:prompt_begin Filament change"
    RESPOND TYPE=command MSG="action:prompt_text Filament change requested. Please load new filament and press resume."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button Unload|UNLOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button Purge|PURGE_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Resume|_INTERACTIVE_LOAD_END"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _INTERACTIVE_LOAD_END]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RESUME

[gcode_shell_command switch-frontend]
command: sh /usr/local/bin/switch_frontend.sh
timeout: 15
verbose: False

[gcode_macro SWITCH_FRONTEND]
description: Switch moonraker frotend between Mainsail and Fluidd
gcode:
  {% set frontend = params.FRONTEND|default("") %}
  RUN_SHELL_COMMAND CMD=switch-frontend PARAMS="{frontend}"

[gcode_shell_command backlight]
command: setsid -f backlight
timeout: 1.
verbose: False

[gcode_macro LCD_ON]
description: Turn on the lcd screen and set the brightness in percent.
gcode:
  {% set brightness = params.BACKLIGHT|default("50") %}
  RUN_SHELL_COMMAND CMD=backlight PARAMS="{brightness}%"

[gcode_macro LCD_OFF]
description: Turn off the lcd screen.
gcode:
  LCD_ON BACKLIGHT=0

[gcode_shell_command audio_freq]
command: audio freq
timeout: 3
verbose: False

[gcode_shell_command audio_midi]
command: setsid -f audio midi
timeout: 30
verbose: False

[gcode_macro M300]
gcode:
    # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 10ms duration is P is omitted.
    {% set P = params.P|default(10)|float %}
    RUN_SHELL_COMMAND CMD=audio_freq PARAMS="-f {S} -d {P / 1000}"

[gcode_macro PLAY_MIDI]
gcode:
    {% set FILE = params.FILE|default("getitem.mid")|string %}
    {% set C = params.C|default(0)|string %}
    RUN_SHELL_COMMAND CMD=audio_midi PARAMS="-m /usr/share/midis/{FILE} -c {C}"

[gcode_shell_command reboot-stock-system]
command: reboot-stock-system
timeout: 5
verbose: False

[gcode_macro REBOOT_STOCK_SYSTEM]
description: Reboot the printer to stock system.
gcode:
    {% if printer["idle_timeout"].state == "Printing" %}
        {action_raise_error("Not possible during print.")}
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_begin Question"
    RESPOND TYPE=command MSG="action:prompt_text The printer will reboot and start the stock Flashforge system. Select REBOOT to continue."
    RESPOND TYPE=command MSG="action:prompt_footer_button Abort|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Reboot|_REBOOT_STOCK_SYSTEM|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _REBOOT_STOCK_SYSTEM]
gcode:
    TURN_OFF_HEATERS
    M84 ; disable stepper motors
    RUN_SHELL_COMMAND CMD=reboot-stock-system

[gcode_shell_command remove-klipper-mod]
command: remove-klipper-mod -f
timeout: 5
verbose: False

[gcode_macro REMOVE_KLIPPER_MOD]
description: Reboot the printer to stock system.
gcode:
    {% if printer["idle_timeout"].state == "Printing" %}
        {action_raise_error("Not possible during print.")}
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_begin Question"
    RESPOND TYPE=command MSG="action:prompt_text Klipper Mod will remove itself from the printer. All data related to the mod including G-Codes files will be lost. Select REMOVE to continue."
    RESPOND TYPE=command MSG="action:prompt_footer_button Abort|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Remove|_REMOVE_KLIPPER_MOD|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _REMOVE_KLIPPER_MOD]
gcode:
    TURN_OFF_HEATERS
    M84 ; disable stepper motors
    RUN_SHELL_COMMAND CMD=remove-klipper-mod

## Shutdown commands
[gcode_shell_command stop-and-sync]
command: sh -c /usr/libexec/shutdown
timeout: 15
verbose: True

[gcode_shell_command shutdown-ad5m]
command: systemctl poweroff
timeout: 15
verbose: False

[gcode_macro SHUTDOWN]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Question"
    RESPOND TYPE=command MSG="action:prompt_text Klipper Mod will shutdown. This will end any active prints. Are you sure?"
    RESPOND TYPE=command MSG="action:prompt_footer_button Abort|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Shutdown|_SHUTDOWN_STAGE|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _POWER_OFF]
gcode:
    SET_PIN PIN=_power_off VALUE=0

[gcode_macro _SHUTDOWN_BUTTON_TRIGGER]
variable_trigger_allowed: False
gcode:
    {% if trigger_allowed %}
        # Reset button state, otherwise only one trigger can occur
        SET_PIN PIN=_clear_power_off VALUE=1
        # There is a deboucing circuit which needs some delay
        G4 P500
        # Disable pin again otherwise on reset the button will be triggered 1-3 times
        SET_PIN PIN=_clear_power_off VALUE=0
        RESPOND TYPE=error MSG="Shutdown triggered by button"
        SHUTDOWN
    {% endif %}

[delayed_gcode _PRO_BUTTON_BOUNCE_GUARD]
# Guard is needed as the button might trigger 0-2 times on RESTART
initial_duration: 1
gcode:
    SET_GCODE_VARIABLE MACRO=_SHUTDOWN_BUTTON_TRIGGER VARIABLE=trigger_allowed VALUE=True


[gcode_macro _SHUTDOWN_STAGE]
gcode:
# remove promt as sometimes it gets stuck in fluidd
    RESPOND TYPE=command MSG=action:prompt_end
    RUN_SHELL_COMMAND CMD=stop-and-sync
# power off will not do anything on a ad5m non pro
    _POWER_OFF
    RUN_SHELL_COMMAND CMD=shutdown-ad5m

[gcode_macro AUTO_SHUTDOWN]
gcode:
  UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=30
    

[delayed_gcode AUTO_SHUTDOWN_CHECK]
gcode:
  {% if printer.idle_timeout.state == "Idle" or printer.idle_timeout.state == "Ready" %}
    {% if printer.extruder.temperature < 50.0 and printer.heater_bed.temperature < 50.0 %}
        {% if printer.extruder.target == 0.0 and printer.heater_bed.target == 0.0 %}
            UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=0
            _SHUTDOWN_STAGE
        {% else %}
            UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=2
        {% endif %}
    {% else %}
        {% if printer.idle_timeout.state == "Printing" %}
            UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=0
        {% else %}
            {% if printer.extruder.target == 0.0 and printer.heater_bed.target == 0.0 %}
                UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=2
            {% else %}
                UPDATE_DELAYED_GCODE ID=AUTO_SHUTDOWN_CHECK DURATION=0
            {% endif %}
        {% endif %}
    {% endif %}
  {% endif %}
