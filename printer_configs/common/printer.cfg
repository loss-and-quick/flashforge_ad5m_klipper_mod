[include printer.base.cfg] # Base machine setup
[include web/client.cfg]       # Macros required for Mainsail & Fluidd
[include macros.cfg]       # Custom Macros for AD5M
[include macros-pro.cfg]   # Custom Macros for the AD5M Pro
[include timelapse.cfg]    # Moonraker timelapse component

[exclude_object]

[save_variables]
filename: ~/printer_data/config/variables.cfg

[idle_timeout]
timeout:600

[pause_resume]
recover_velocity: 50

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[extruder]
# default value from Flashforge
rotation_distance: 4.4
# PID calibrated with AD5M, target 215
control = pid
pid_kp = 33.443
pid_ki = 4.372
pid_kd = 63.961

[heater_bed]
# PID calibrated with AD5M, target 70
control = pid
pid_kp = 74.793
pid_ki = 1.619
pid_kd = 863.863

[input_shaper]
# calibrated with AD5M
shaper_type_x = mzv
shaper_freq_x = 52.5
shaper_type_y = zv
shaper_freq_y = 50

#Fake profile, it must be calibrated if desired.
[skew_correction skew_profile]
xy_skew = 0.0
xz_skew = 0.0
yz_skew = 0.0

[md5_checker]

[flashforge_loadcell]
mcu: mcu

[temperature_sensor Load_Cell]
sensor_type: flashforge_loadcell

[flashforge_tvoc]
mcu: mcu

[temperature_sensor TVOC_Level]
sensor_type: flashforge_tvoc
