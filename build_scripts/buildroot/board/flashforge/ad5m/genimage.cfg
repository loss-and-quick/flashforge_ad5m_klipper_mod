image boot.vfat {
	vfat {
		files = {
			"zImage",
			"uImage",
			"sunxi.dtb",
			"sun8i-t113s3-flashforge-ad5m.dtb",
			"sun8i-t113s4-flashforge-ad5m.dtb",
			"boot.scr"
		}
	}
	size = 64M
}

image ad5m-system.img {
	hdimage {
		partition-table-type = "gpt"
		gpt-location = 1M
	}

	partition boot0 {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition boot {
		image = "boot.vfat"
		partition-type-uuid = "F"
		bootable = "true"
		offset = 36M
	}

	partition env {
		partition-type-uuid = "L"
		size = 1M
	}

	partition env_redund {
		partition-type-uuid = "L"
		size = 1M
	}

	partition reserved {
		partition-type-uuid = "L"
		size = 32M
	}

	partition dsp0 {
		partition-type-uuid = "L"
		size = 1M
	}

	partition rootfs {
		image = "rootfs.ext4"
		partition-type-uuid = "L"
		size = 1200M
	}

	partition data {
		partition-type-uuid = "L"
		size = 2048M
	}
}
